<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101714"><title>The Last Round — Birthday Hunt</title><meta name="description" content="Ten ciphers. One last round. Birthday hunt around Paddington Recreation Ground.">
<style>
:root{color-scheme:dark;--bg:#0c1512;--panel:#17231d;--sub:#9aad9f;--green:#c6ff70;--border:#304239;--white:#f6f8f4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--white);line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}.shell{max-width:1050px;margin:auto;padding:20px 22px 65px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0 30px;border-bottom:1px solid var(--border);flex-wrap:wrap}.logo{font-size:22px;font-weight:950;letter-spacing:-1px;text-decoration:none;line-height:1}.logo span{color:var(--green)}.minor{color:var(--sub);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:750}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:1px solid var(--border);color:var(--white);background:transparent;padding:10px 14px;border-radius:7px;font-size:12px;font-weight:850}.nav button:hover,.nav button.active{border-color:var(--green);color:var(--green)}h1{font-size:clamp(45px,9vw,100px);line-height:.95;letter-spacing:-.075em;margin:20px 0 25px;font-weight:950}h1 em,.green{font-style:normal;color:var(--green)}h2{font-size:clamp(27px,5vw,45px);letter-spacing:-.05em;line-height:1.07;margin:10px 0 18px}h3{font-size:20px}.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:850;color:var(--green);text-transform:uppercase}p{color:#bbccc0}.hero{display:grid;grid-template-columns:1.2fr .85fr;gap:50px;align-items:center;padding:65px 0}.panel{padding:30px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}label{display:block;color:#b1c2b5;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.14em;margin:22px 0 9px}input,textarea,select{display:block;width:100%;background:#08110c;border:1px solid #47614e;border-radius:7px;color:white;padding:15px;font-size:17px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--green)}textarea{min-height:115px;resize:vertical}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:10px 8px 0 0;padding:14px 20px;min-height:48px;background:var(--green);color:#111b10;border:1px solid var(--green);border-radius:7px;font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase}.btn.alt{background:transparent;color:var(--green)}.btn.warn{color:#f8d7b0;border-color:#805f44;background:transparent}.btn.full{width:100%}.facts{display:flex;gap:14px;flex-wrap:wrap}.facts span{border:1px solid var(--border);padding:9px 13px;border-radius:6px;font-size:12px;color:#d3e0d0}.notice{padding:12px 15px;background:#25382a;border:1px solid var(--green);border-radius:8px;margin:15px 0;color:white}.notice.bad{border-color:#d38c7d;color:#ffd7ca}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:16px}.step{border-top:1px solid var(--border);padding-top:24px}.step b{color:var(--green)}.step p{font-size:14px}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:40px 0 20px;flex-wrap:wrap}.pagehead h2{margin:8px 0}.metric{font-size:28px;font-weight:950;letter-spacing:-.03em}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;margin-top:24px}.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.progress div{height:6px;border-radius:9px;background:#304237}.progress div.done{background:var(--green)}.progress div.active{background:#f9d47d}.paper{background:#e8efdd;color:#183024;padding:30px;border-radius:10px;margin:25px 0}.paper p{color:#2a4934;white-space:pre-wrap;margin:15px 0;font-size:17px}.paper h2{color:#183024}.paper .eyebrow{color:#416a46}.paper label{color:#35523b}.paper input{background:white;color:#1c3422;border-color:#8ba789}.hint{padding:13px 16px;border-left:3px solid var(--green);background:#263b2d;margin:12px 0}.destination{padding:35px;background:#c6ff70;color:#132218;border-radius:12px}.destination .eyebrow,.destination p{color:#29402f}.destination h2{font-size:clamp(40px,8vw,72px);word-wrap:break-word}.destination .btn{background:#112318;color:white;border-color:#112318}.sidebar{align-self:start}.sidebar .panel{margin-bottom:12px}.sidebar .metric{margin:6px 0 22px}.number{font-size:48px;font-weight:950;color:var(--green);letter-spacing:-.06em}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:480px}.table th{text-align:left;font-size:11px;letter-spacing:.14em;color:var(--sub)}.table td,.table th{padding:14px 12px;border-bottom:1px solid var(--border)}.table tr:first-child td{color:var(--green)}.table td button{margin:0}.editbox{margin-top:22px;border-top:1px solid var(--border);padding-top:14px}.tiny{font-size:12px;color:var(--sub)}.pill{padding:6px 9px;background:#2b4230;border-radius:100px;color:var(--green);font-size:11px;font-weight:850;text-transform:uppercase}.complete{text-align:center;padding:80px 12px}.complete h1{font-size:clamp(56px,11vw,120px)}.footer{border-top:1px solid var(--border);padding:25px 0;margin-top:75px;color:#8da194;font-size:11px;letter-spacing:.1em}.cipher{padding:15px;border:1px solid #93a995;background:#eef5e6;border-radius:8px;margin:10px 0}.cipher output{display:block;font-size:20px;font-weight:850;letter-spacing:.06em;overflow-wrap:anywhere;color:#183024}.cipher input{accent-color:#24462b}.cipher label{color:#183024}.info{white-space:pre-wrap}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.admin-grid .panel{padding:19px}.short{max-width:630px}#new-code{word-break:break-all;font-weight:900;color:var(--green);font-size:25px}input[type=range]{padding:10px 0;border:0;background:transparent} @media(max-width:780px){.hero,.layout{grid-template-columns:1fr}.hero{padding-top:44px;gap:18px}.steps{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.shell{padding:12px 16px 45px}.panel{padding:20px}.paper{padding:22px}.top{padding:16px 0}.nav button{padding:10px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sidebar .panel{margin:0}.sidebar .metric{font-size:23px}.destination{padding:26px}}@media(max-width:430px){.sidebar{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><a class="logo" href="./">THE LAST<br>ROUND<span>.</span></a><div class="minor">A BIRTHDAY CIPHER CHASE<br>PADDINGTON · LONDON</div><nav class="nav" id="nav"></nav></header><main id="app"><p>Connecting to the game...</p></main><footer class="footer">THE LAST ROUND / AD 2026 · 10 STAGES · 1 DESTINATION · NO RUNNING</footer></div>
<script>
const root=document.getElementById("app"),nav=document.getElementById("nav");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmt=n=>String(Math.max(0,n)).padStart(2,"0");
const elapsed=(from,to)=>{if(!from)return"00:00:00";let n=Math.max(0,Math.floor((new Date(to||Date.now())-new Date(from))/1000));return[fmt(n/3600|0),fmt(n%3600/60|0),fmt(n%60)].join(":")};
let teamCode=localStorage.getItem("last_round_team")||"",hostKey=sessionStorage.getItem("last_round_host")||"",state=null,host=null,view=location.search.includes("host")?"hostlogin":"home",message="",error=false,editing=1,editorOpen=false,lastCode="";
async function api(action,payload){let res;try{res=await fetch("./api",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,payload})});}catch(e){throw Error("Network unavailable. Check your connection.");}let value;try{value=await res.json()}catch{throw Error("Unexpected response from the game server.")};if(!res.ok||value.error)throw Error(value.error||"Server error");return value;}
function say(s,bad=false){message=s;error=bad;}
function msg(){return message?'<div role="alert" class="notice '+(error?'bad':'')+'">'+esc(message)+'</div>':""}
function go(v){view=v;message="";render();window.scrollTo({top:0,behavior:"smooth"})}
function header(t,s){return '<div class="pagehead"><div><div class="eyebrow">TEAM FIELD TERMINAL</div><h2>'+esc(t.name)+'</h2></div><div><span class="minor">CURRENT STAGE</span><div class="metric">'+fmt(t.stage)+' / 10</div></div></div><div class="progress">'+Array.from({length:10},(_,i)=>'<div class="'+(i<t.progress?'done':i===t.stage-1?'active':'')+'"></div>').join("")+'</div>'}
function side(t){return '<aside class="sidebar"><section class="panel"><div class="minor">ELAPSED TIME</div><div class="metric live-timer" data-start="'+esc(t.startedAt||"")+'" data-end="'+esc(t.finishedAt||"")+'">'+elapsed(t.startedAt,t.finishedAt)+'</div><div class="minor">TOTAL POINTS</div><div class="metric">'+t.score+' / 100</div></section><section class="panel"><div class="eyebrow">FIELD RULES</div><p>10 points per correct cipher. Each hint costs 2. Wrong answers cost 1 (up to 5 per stage).</p><p>No running, no web searching, keep your team together.</p><button class="btn alt" data-go="leader">LEADERBOARD →</button></section></aside>'}
function cipher(p){if(!p.cipher)return"";return '<div class="cipher"><label for="shift">OPTIONAL CAESAR DECODER · SHIFT <span id="shift-number">0</span></label><input id="shift" type="range" min="0" max="25" value="0"><output id="decoded" data-cipher="'+esc(p.cipher)+'">'+esc(p.cipher)+'</output></div>'}
function game(){if(!state)return home();const t=state.team;if(t.phase==="finished")return '<div class="complete"><div class="eyebrow">MISSION COMPLETE / TEN OUT OF TEN</div><h1>THE <em>LAST</em><br>ROUND.</h1><h2>THE CARLTON TAVERN</h2><p>33 Carlton Vale · Time: <span class="live-timer" data-start="'+esc(t.startedAt||"")+'" data-end="'+esc(t.finishedAt||"")+'">'+elapsed(t.startedAt,t.finishedAt)+'</span></p><div class="number">'+t.score+' / 100</div><p>Your final mission: get Adrian a drink.</p><button class="btn" data-go="leader">VIEW LEADERBOARD</button></div>';let body;
if(state.status!=="live")body='<section class="panel"><div class="eyebrow">AWAITING ORGANISER</div><h2>'+ (state.status==="paused"?"Game paused":"Waiting for the starting signal")+'</h2><p>Your progress is saved. Check back when the organiser starts the hunt.</p><button class="btn alt" data-action="refresh">CHECK STATUS ↻</button></section>';
else if(t.phase==="travel"){const d=state.travel;body='<div class="destination"><div class="eyebrow">CORRECT / DESTINATION UNLOCKED</div><h2>'+esc(d.destination)+'</h2><p>'+esc(d.arrival)+'</p><p>'+esc(d.fact)+'</p><p><strong>Only unlock the next cipher once your whole team has arrived.</strong></p><button class="btn" data-action="arrive">WE ARE HERE → UNLOCK</button></div>'}
else{const p=state.puzzle;body='<div class="panel"><div class="eyebrow">'+esc(p.tag)+' · STAGE '+t.stage+'/10</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.intro)+'</p><div class="paper"><div class="eyebrow">CLASSIFIED FIELD DOCUMENT</div><p>'+esc(p.body)+'</p>'+cipher(p)+'<p><strong>'+esc(p.instruction)+'</strong></p><form id="answer"><label for="solution">YOUR SOLUTION</label><input id="solution" name="answer" maxlength="100" required autocomplete="off" autocapitalize="characters" placeholder="'+esc(p.placeholder||"Enter decoded destination")+'"><button class="btn" type="submit">SUBMIT SOLUTION ↗</button></form></div><button class="btn alt" data-action="hint" '+(t.hintsUsed>=3?'disabled':'')+'>UNLOCK HINT (−2 POINTS)</button>'+(state.unlockedHints||[]).map((h,i)=>'<div class="hint">HINT '+(i+1)+': '+esc(h)+'</div>').join("")+'</div>'}
return header(t,state)+'<div class="layout"><div>'+body+msg()+'</div>'+side(t)+'</div>'}
function home(){return '<section class="hero"><div><div class="eyebrow">THE OFFICIAL BIRTHDAY FIELD OPERATION</div><h1>TEN CLUES.<br>ONE <em>LAST</em><br>ROUND.</h1><p>Race through Paddington Recreation Ground. Solve ciphers, unlock secret destinations and discover where the first round is waiting.</p><div class="facts"><span>10 SECRET CHECKPOINTS</span><span>~90 MINUTES</span><span>NO RUNNING</span></div></div><div class="panel"><div class="eyebrow">TEAM ACCESS</div><h2>Ready to decode?</h2><p>One captain per team. Enter the private access code from your organiser.</p><form id="login"><label for="team">TEAM CODE</label><input id="team" name="code" required maxlength="25" placeholder="XXXX-XXXX-XXXX"><button class="btn full" type="submit">ENTER THE HUNT ↗</button></form>'+msg()+'</div></section><div class="steps"><div class="step"><b>01 — SOLVE</b><p>Decode each challenge to discover your next location.</p></div><div class="step"><b>02 — MOVE</b><p>Travel together and confirm when everyone arrives.</p></div><div class="step"><b>03 — FINISH</b><p>Beat the other teams on points. Time breaks ties.</p></div></div>'}
function board(){const list=state?.leaderboard||[];return '<div class="pagehead"><div><div class="eyebrow">THE COMPETITION</div><h2>LEADERBOARD<span class="green">.</span></h2></div><button class="btn alt" data-action="refresh">REFRESH ↻</button></div><p>Scores are sorted by points, then progress. Destinations remain secret.</p><div class="panel tablewrap"><table class="table"><thead><tr><th>RANK</th><th>TEAM</th><th>PROGRESS</th><th>POINTS</th></tr></thead><tbody>'+list.map((t,i)=>'<tr><td>'+fmt(i+1)+'</td><td><strong>'+esc(t.name)+'</strong> '+(t.finished?'<span class="pill">FINISHED</span>':'')+'</td><td>'+t.progress+'/10</td><td><strong>'+t.score+'</strong></td></tr>').join("")+'</tbody></table>'+(list.length?'':'<p>Log into a team to view standings.</p>')+'</div>'}
function hostLogin(){return '<section class="hero"><div><div class="eyebrow">PRIVATE / ORGANISER ONLY</div><h1>CONTROL<br><em>ROOM.</em></h1><p>Launch the hunt, create teams, track scores and edit ciphers.</p></div><div class="panel"><h2>Organiser sign-in</h2><form id="hostlogin"><label for="pass">PRIVATE HOST PASSPHRASE</label><input id="pass" type="password" required minlength="16" placeholder="Your organiser passphrase"><button class="btn full">ENTER CONTROL ROOM</button></form>'+msg()+'</div></section>'}
function hostPage(){if(!host)return hostLogin();return '<div class="pagehead"><div><div class="eyebrow">GAME MASTER TERMINAL</div><h2>CONTROL ROOM.</h2><span class="pill">'+esc(host.status)+'</span></div><div><button class="btn alt" data-action="hostrefresh">REFRESH ↻</button></div></div>'+msg()+'<div class="admin-grid"><div class="panel"><div class="minor">REGISTERED TEAMS</div><div class="number">'+host.teams.length+'</div></div><div class="panel"><div class="minor">GAME STATUS</div><div class="metric">'+esc(host.status.toUpperCase())+'</div></div><div class="panel"><div class="minor">STARTED</div><div class="metric" style="font-size:16px">'+esc(host.gameStartedAt?new Date(host.gameStartedAt).toLocaleString():"Not yet")+'</div></div></div><section class="panel" style="margin:20px 0"><h3>Game controls</h3><button class="btn" data-action="start">START / RESUME</button><button class="btn alt" data-action="pause">PAUSE</button><button class="btn alt" data-action="lobby">LOBBY</button><button class="btn warn" data-action="reset">RESET ALL</button></section><section class="panel" style="margin-bottom:20px"><h3>Register a team</h3><form id="create"><label for="name">TEAM NAME</label><input class="short" id="name" name="name" required minlength="2" maxlength="50" placeholder="Sherlock Homies"><button class="btn">CREATE TEAM + ACCESS CODE</button></form>'+(lastCode?'<p>Share this private code with the captain:</p><div id="new-code">'+esc(lastCode)+'</div>':'')+'</section><section class="panel" style="margin-bottom:20px"><h3>Teams and progress</h3><div class="tablewrap"><table class="table"><thead><tr><th>TEAM</th><th>STAGE</th><th>POINTS</th><th>CONTROL</th></tr></thead><tbody>'+host.teams.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.stage+'/10 '+esc(t.phase)+'</td><td>'+t.score+'</td><td><button class="btn alt" data-action="advance" data-id="'+esc(t.id)+'">ADVANCE</button><button class="btn warn" data-action="remove" data-id="'+esc(t.id)+'">REMOVE</button></td></tr>').join("")+'</tbody></table></div></section><section class="panel"><h3>Challenge editor</h3><button class="btn alt" data-action="editor">'+(editorOpen?"HIDE EDITOR":"EDIT CIPHERS")+'</button>'+(editorOpen?editForm():'')+'</section><section class="panel" style="margin-top:20px"><h3>Activity log</h3>'+(host.events||[]).slice(0,30).map(e=>'<p class="tiny">'+esc(e.at)+' — '+esc(e.name||'HOST')+': '+esc(e.action)+' '+esc(e.detail||"")+'</p>').join("")+'</section>'}
function editForm(){const p=host.stages.find(x=>x.id===editing)||host.stages[0];return '<div class="editbox"><label for="pick">STAGE</label><select id="pick">'+host.stages.map(x=>'<option value="'+x.id+'" '+(x.id===editing?'selected':'')+'>'+x.id+' — '+esc(x.title)+'</option>').join("")+'</select><form id="edit"><label>TITLE</label><input name="title" value="'+esc(p.title)+'"><label>INSTRUCTIONS / QUESTIONS</label><textarea name="body">'+esc(p.body)+'</textarea><label>ACCEPTED ANSWERS (ONE PER LINE)</label><textarea name="answers">'+esc(p.answers.join("\n"))+'</textarea><label>HINTS (ONE PER LINE)</label><textarea name="hints">'+esc(p.hints.join("\n"))+'</textarea><label>DESTINATION</label><input name="destination" value="'+esc(p.destination)+'"><label>ARRIVAL INSTRUCTIONS</label><textarea name="arrival">'+esc(p.arrival)+'</textarea><button class="btn">SAVE CHANGES</button></form></div>'}
function render(){nav.innerHTML=(teamCode?'<button data-go="game" class="'+(view==="game"?"active":"")+'">MY HUNT</button>':'')+'<button data-go="leader">LEADERBOARD</button><button data-go="hostlogin">HOST</button>'+(teamCode?'<button data-action="logout">SIGN OUT</button>':'');root.innerHTML=view==="home"?home():view==="game"?game():view==="leader"?board():view==="hostlogin"?hostLogin():view==="host"?hostPage():home();tick();}
function tick(){document.querySelectorAll(".live-timer").forEach(x=>x.textContent=elapsed(x.dataset.start,x.dataset.end))}
async function loadTeam(){state=await api("team_state",{code:teamCode});return state}
async function loadHost(){host=await api("admin_state",{password:hostKey});return host}
async function mutate(action,payload={},asHost=false){try{if(asHost){const r=await api(action,{password:hostKey,...payload});if(r.created){lastCode=r.code;await loadHost()}else host=r;view="host"}else{state=await api(action,{code:teamCode,...payload});view="game";if(action==="team_answer")say(state.correct?"Code accepted. Follow the new destination!":"Incorrect code. Try again.",!state.correct);else say("")}render()}catch(e){say(e.message,true);render()}}
document.addEventListener("submit",async e=>{const f=e.target;if(!["login","answer","hostlogin","create","edit"].includes(f.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(f).entries());if(f.id==="login"){teamCode=String(data.code).trim();try{await loadTeam();localStorage.setItem("last_round_team",teamCode);go("game")}catch(e){teamCode="";say(e.message,true);render()}}else if(f.id==="hostlogin"){hostKey=String(data.password);try{await loadHost();sessionStorage.setItem("last_round_host",hostKey);go("host")}catch(e){hostKey="";say(e.message,true);render()}}else if(f.id==="answer")await mutate("team_answer",{answer:data.answer});else if(f.id==="create")await mutate("admin_create_team",{name:data.name},true);else if(f.id==="edit")await mutate("admin_edit_puzzle",{stage:editing,changes:{title:data.title,body:data.body,answers:String(data.answers).split("\n").filter(Boolean),hints:String(data.hints).split("\n").filter(Boolean),destination:data.destination,arrival:data.arrival}},true)});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.go){if(b.dataset.go==="hostlogin"&&hostKey){try{await loadHost();go("host")}catch{go("hostlogin")}}else go(b.dataset.go);return}const a=b.dataset.action;if(!a)return;if(a==="logout"){teamCode="";state=null;localStorage.removeItem("last_round_team");go("home");return}if(a==="refresh"){try{if(teamCode)await loadTeam();render()}catch(e){say(e.message,true);render()}return}if(a==="arrive")return mutate("team_arrive");if(a==="hint")return mutate("team_hint");if(a==="hostrefresh"){try{await loadHost();render()}catch(e){say(e.message,true);render()}return}if(a==="start")return mutate("admin_status",{status:"live"},true);if(a==="pause")return mutate("admin_status",{status:"paused"},true);if(a==="lobby"&&confirm("Return teams to lobby without resetting scores?"))return mutate("admin_status",{status:"lobby"},true);if(a==="reset"&&confirm("Reset all teams, scores and timers?"))return mutate("admin_reset",{},true);if(a==="advance"&&confirm("Manually advance this team?"))return mutate("admin_override",{teamId:b.dataset.id},true);if(a==="remove"&&confirm("Permanently remove this team?"))return mutate("admin_remove_team",{teamId:b.dataset.id},true);if(a==="editor"){editorOpen=!editorOpen;render()}});
document.addEventListener("change",e=>{if(e.target.id==="pick"){editing=Number(e.target.value);render()}});
document.addEventListener("input",e=>{if(e.target.id==="shift"){const shift=Number(e.target.value);const out=document.getElementById("decoded");document.getElementById("shift-number").textContent=shift;const raw=out.dataset.cipher;out.textContent=raw.replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65-shift+26)%26+65))}});
(async()=>{try{if(view==="hostlogin"&&hostKey){await loadHost();view="host"}else if(teamCode){await loadTeam();view="game"}}catch(e){if(view==="hostlogin"){hostKey="";view="hostlogin"}else{teamCode="";view="home"}}render();setInterval(()=>{tick();if(state&&view==="game"&&document.activeElement?.tagName!=="INPUT"&&document.activeElement?.tagName!=="TEXTAREA")loadTeam().then(render).catch(()=>{})},20000);setInterval(tick,1000)})();
</script></body></html>
